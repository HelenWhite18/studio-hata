name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: find wp-content tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  seed-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate generated multilingual content
        run: |
          python3 -m json.tool tools/bootstrap/hata-a/pages.json > /dev/null
          python3 -m json.tool tools/bootstrap/hata-a/content/nl.json > /dev/null
          python3 -m json.tool tools/bootstrap/hata-a/content/en.json > /dev/null
          python3 -m json.tool tools/bootstrap/hata-a/content/uk.json > /dev/null
          if [[ -f tools/seed/content.json ]]; then
            python3 -m json.tool tools/seed/content.json > /dev/null
            python3 tools/seed/build_content.py
            git diff --exit-code -- tools/seed/content.json
          fi
