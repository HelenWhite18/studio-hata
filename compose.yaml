name: ${COMPOSE_PROJECT_NAME:-studio-hata}

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-studio_hata}
      MARIADB_USER: ${DB_USER:-studio_hata}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-local-root-only}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-studio_hata}
      WORDPRESS_DB_USER: ${DB_USER:-studio_hata}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
      WP_DEBUG: ${WP_DEBUG:-true}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', getenv('WP_ENVIRONMENT_TYPE') ?: 'local');
        define('WP_DEBUG', filter_var(getenv('WP_DEBUG') ?: false, FILTER_VALIDATE_BOOLEAN));
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        if (in_array(WP_ENVIRONMENT_TYPE, ['staging', 'production'], true)) {
            define('DISALLOW_FILE_MODS', true);
        }
    volumes:
      - wordpress_core:/var/www/html
      - ./wp-content:/var/www/html/wp-content

volumes:
  database_data:
  wordpress_core:

